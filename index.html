<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050A15">
<title>Alili AI v12.0</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--bg:#050A15;--card:rgba(10,20,40,0.8);--txt:#fff;--mut:#8fa3b8;--brd:rgba(0,210,255,0.15);--acc:#00d2ff;--success:#00ff87;--danger:#ff4444;--hover:rgba(0,210,255,0.1)}
body{background:var(--bg);color:var(--txt);height:100dvh;width:100vw;overflow:hidden;display:flex;flex-direction:column;background-image:radial-gradient(circle at 10% 20%,rgba(0,210,255,0.1),transparent 40%),radial-gradient(circle at 90% 80%,rgba(255,0,204,0.08),transparent 40%)}
button{cursor:pointer;font-family:inherit;background:none;border:none;color:inherit}
#splash{position:fixed;inset:0;background:var(--bg);z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}
#splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
#splash .logo{font-size:36px;font-weight:900;background:linear-gradient(90deg,var(--acc),#ff00cc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header{flex-shrink:0;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(10,10,20,0.85);border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center}
.icon-btn{color:var(--mut);padding:6px;border-radius:8px}
.logo-txt{font-size:14px;font-weight:900;background:linear-gradient(90deg,var(--acc),#ff00cc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
main{flex:1;overflow-y:auto;padding:16px 14px 180px;display:flex;flex-direction:column}
#chatBox{display:flex;flex-direction:column;gap:14px;max-width:800px;margin:0 auto;width:100%}
#welcome{padding:20px;display:flex;flex-direction:column;align-items:center;text-align:center}
#welcome.hide{display:none}
.welcome-title{font-size:24px;font-weight:900;color:var(--acc);margin-bottom:6px}
.msg{display:flex;gap:8px;max-width:100%}
.msg.user{flex-direction:row-reverse}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.msg.user .avatar{background:linear-gradient(135deg,var(--acc),#0055ff);color:#fff}
.msg.ai .avatar{background:linear-gradient(135deg,#ff00cc,#7a00ff);color:#fff}
.bubble{max-width:calc(100% - 50px);padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.65;min-width:0}
.msg.user .bubble{background:linear-gradient(135deg,var(--acc),#0055ff);color:#fff;border-top-right-radius:4px}
.msg.ai .bubble{background:var(--card);border:1px solid var(--brd);border-top-left-radius:4px}
.md p{margin-bottom:8px}.md p:last-child{margin-bottom:0}
.md pre{background:#0d1117;padding:12px;border-radius:10px;direction:ltr;overflow-x:auto;margin:10px 0}
.md code{background:rgba(0,0,0,0.4);color:#ff00cc;padding:2px 5px;border-radius:4px;font-family:monospace;font-size:12px}
.msg-media{max-width:100%;border-radius:10px;margin-top:8px}
.input-wrap{position:fixed;bottom:0;left:0;right:0;padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:100}
.tools-row{display:flex;gap:6px;margin-bottom:6px;max-width:800px;margin:0 auto;overflow-x:auto}
.tool-chip{padding:5px 10px;border-radius:12px;background:var(--card);border:1px solid var(--brd);font-size:10px;font-weight:700;color:var(--mut);white-space:nowrap}
.input-bar{display:flex;gap:6px;align-items:center;background:var(--card);padding:5px 8px;border-radius:24px;border:1px solid var(--brd);max-width:800px;margin:0 auto}
.input-bar input{flex:1;padding:8px 4px;background:transparent;border:none;outline:none;color:var(--txt);font-size:14px}
.send-btn{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#0055ff);display:flex;justify-content:center;align-items:center;color:#fff}
#sidebar{position:fixed;top:0;right:-300px;width:280px;height:100dvh;background:var(--bg);z-index:600;transition:right .3s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#sidebar.open{right:0}
.sb-head{padding:16px;border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center}
#chatHistory{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.chat-item{padding:10px;border-radius:8px;background:var(--hover);font-size:13px;cursor:pointer;color:var(--mut);display:flex;justify-content:space-between}
.chat-item.active{border:1px solid var(--acc);color:#fff}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500}
#overlay.show{display:block}
#toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px;border-radius:10px;font-size:12px;opacity:0;transition:.3s;z-index:10000;text-align:center;border:1px solid var(--brd)}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="splash"><div class="logo">ALILI</div></div>
<div id="toast"></div>
<header>
  <button class="icon-btn" onclick="toggleSidebar(true)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
  <span class="logo-txt">Alili AI</span>
</header>
<main id="main">
  <div id="welcome"><div class="welcome-title">مرحباً بك</div><div style="color:var(--mut)">سرعة خارقة بفضل البث المباشر</div></div>
  <div id="chatBox"></div>
</main>
<div class="input-wrap">
  <div class="tools-row">
    <div class="tool-chip" onclick="generateImagePrompt()">🎨 توليد صورة</div>
  </div>
  <div class="input-bar">
    <input type="text" id="chatInput" placeholder="اكتب رسالتك..." onkeypress="onEnter(event)">
    <button class="send-btn" id="btnSend" onclick="sendMessage()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
  </div>
</div>
<div id="overlay" onclick="toggleSidebar(false)"></div>
<div id="sidebar">
  <div class="sb-head"><h2>المحادثات</h2><button onclick="newChat()" style="background:var(--success);color:#000;padding:5px 10px;border-radius:5px;font-weight:bold">جديد +</button></div>
  <div id="chatHistory"></div>
</div>
<script>
const WORKER_URL = "https://alili-ai-pro.medalili2045.workers.dev";
if(typeof marked !== 'undefined') marked.setOptions({breaks:true, gfm:true});
let store = { async getItem(){ return null; }, async setItem(){ return null; } };
if(typeof localforage !== 'undefined'){ store = localforage.createInstance({name:'AliliAI'}); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function mdParse(text){ return typeof marked!=='undefined' ? marked.parse(text||'') : escapeHtml(text); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.className='show'; setTimeout(()=>t.className='', 4000); }

let allChats = {}, currentChatId = null, pendingChatId = null;

async function loadChats(){ try{ const s = await store.getItem('chats'); if(s) allChats = s; }catch(e){} if(Object.keys(allChats).length===0) newChat(); else { const ids=Object.keys(allChats).sort((a,b)=>allChats[b].ts-allChats[a].ts); currentChatId=ids[0]; } renderHistory(); renderChat(); }
async function saveChats(){ try{ await store.setItem('chats', allChats); }catch(e){} }
function newChat(){ currentChatId=Date.now().toString(); allChats[currentChatId]={id:currentChatId,title:'محادثة جديدة',ts:Date.now(),messages:[]}; saveChats(); renderHistory(); renderChat(); toggleSidebar(false); }
function switchChat(id){ currentChatId=id; renderHistory(); renderChat(); toggleSidebar(false); }
function deleteChat(id){ if(!confirm('حذف؟'))return; delete allChats[id]; saveChats(); if(currentChatId===id) newChat(); else renderHistory(); }
function renderHistory(){ const list=document.getElementById('chatHistory'); list.innerHTML=''; Object.values(allChats).sort((a,b)=>b.ts-a.ts).forEach(c=>{ const d=document.createElement('div'); d.className='chat-item'+(c.id===currentChatId?' active':''); d.innerHTML=`<span>${escapeHtml(c.title)}</span><button onclick="event.stopPropagation();deleteChat('${c.id}')" style="color:var(--danger)">🗑️</button>`; d.onclick=()=>switchChat(c.id); list.appendChild(d); }); }
function renderChat(){ const box=document.getElementById('chatBox'); box.innerHTML=''; const msgs=allChats[currentChatId]?.messages||[]; document.getElementById('welcome').classList.toggle('hide', msgs.length>0); msgs.forEach((m)=>{ const w=document.createElement('div'); w.className='msg '+(m.role==='user'?'user':'ai'); let contentHtml = m.role==='ai'?mdParse(m.content):escapeHtml(m.content); if(m.image){ contentHtml = `<img src="${m.image}" class="msg-media">` + contentHtml; } w.innerHTML=`<div class="avatar">${m.role==='user'?'👤':'✨'}</div><div class="bubble ${m.role==='ai'?'md':''}">${contentHtml}</div>`; box.appendChild(w); }); scrollBottom(); }
function scrollBottom(){ const m=document.getElementById('main'); m.scrollTop=m.scrollHeight; }

async function generateImagePrompt(){ 
  const p = prompt("اكتب وصف الصورة (بالإنجليزية أو العربية):"); 
  if(p) sendImageRequest(p); 
}

async function sendImageRequest(prompt){
  document.getElementById('welcome').classList.add('hide');
  const cid=currentChatId;
  allChats[cid].messages.push({role:'user', content:`🎨 توليد صورة: ${prompt}`});
  saveChats(); renderChat();
  
  const box=document.getElementById('chatBox');
  const w=document.createElement('div'); w.className='msg ai';
  w.innerHTML=`<div class="avatar">✨</div><div class="bubble"><div class="typing">⏳ جاري التوليد...</div></div>`;
  box.appendChild(w); scrollBottom();

  try{
    const res = await fetch(WORKER_URL + "/image", { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ prompt }) });
    const data = await res.json();
    
    if(data.error) throw new Error(data.error);
    
    allChats[cid].messages.push({role:'assistant', content:'', image:data.image});
    saveChats(); if(currentChatId===cid) renderChat();
  }catch(e){ 
    w.querySelector('.bubble').innerHTML = `<span style="color:var(--danger)">❌ ${e.message}</span>`;
  }
}

async function sendMessage(){
  if(pendingChatId) return toast('⏳ انتظر الرد الحالي');
  const input=document.getElementById('chatInput'); const text=input.value.trim();
  if(!text) return;
  
  document.getElementById('welcome').classList.add('hide');
  const cid=currentChatId; allChats[cid].messages.push({role:'user', content:text});
  if(allChats[cid].title==='محادثة جديدة'){ allChats[cid].title=text.substring(0,20); renderHistory(); }
  input.value=''; renderChat();
  
  pendingChatId=cid;
  
  const box=document.getElementById('chatBox');
  const w=document.createElement('div'); w.className='msg ai';
  w.innerHTML=`<div class="avatar">✨</div><div class="bubble md"></div>`;
  box.appendChild(w); scrollBottom();
  const mdEl = w.querySelector('.md');
  let aiFull = '';

  try{
    const msgs = allChats[cid].messages.map(m=>({role:m.role, content:m.content}));
    const res = await fetch(WORKER_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ messages: msgs }) });
    
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      throw new Error(err.error || 'HTTP Error ' + res.status);
    }
    
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      
      const chunk = decoder.decode(value, {stream:true});
      for(const line of chunk.split('\n')){
        if(line.startsWith('data: ') && !line.includes('[DONE]')){
          try{
            const data = JSON.parse(line.substring(6));
            const t = data.choices?.[0]?.delta?.content || '';
            if(t){ aiFull += t; mdEl.innerHTML = mdParse(aiFull); scrollBottom(); }
          }catch(e){}
        }
      }
    }
    allChats[cid].messages.push({role:'assistant', content:aiFull});
    saveChats();
  }catch(e){
    mdEl.innerHTML = `<span style="color:var(--danger)">❌ ${e.message}</span>`;
  }finally{ pendingChatId=null; }
}

function toggleSidebar(o){ document.getElementById('sidebar').classList.toggle('open',o); document.getElementById('overlay').classList.toggle('show',o); }
function onEnter(e){ if(e.key==='Enter'){ e.preventDefault(); sendMessage(); } }

window.onload = async ()=>{ 
  if(window.AliliNative){ try{ await window.AliliNative.init(); }catch(e){} }
  setTimeout(()=>{ document.getElementById('splash').classList.add('hidden'); }, 1000);
  await loadChats(); 
};
</script>
</body>
</html>
