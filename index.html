<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050A15">
<title>Alili AI</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="capacitor-bridge.js"></script>
</head>
<body>

<div id="splash">
    <img src="assets/icon.png" class="logo-img" alt="Alili AI" onerror="this.style.display='none'">
    <div class="logo-text">ALILI AI</div>
</div>

<div id="toast"></div>

<header>
    <div class="h-left">
        <button class="icon-btn" onclick="toggleSidebar(true)">☰</button>
        <span class="logo-txt">Alili AI</span>
    </div>
    <div class="h-right">
        <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
        <button class="icon-btn" onclick="openSettings()">⚙️</button>
    </div>
</header>

<main id="main">
    <div id="welcome">
        <div class="welcome-title">مرحباً بك 👋</div>
        <div class="welcome-sub">اسأل أي شيء، أو قل "ارسم لي..." أو "اصنع فيديو..."</div>
        <div class="quick-grid">
            <div class="quick-card" onclick="quickAction('اشرح لي الذكاء الاصطناعي ببساطة')"><div class="q-icon">🧠</div><div class="q-title">اشرح مفهوم</div></div>
            <div class="quick-card" onclick="quickAction('اكتب لي إيميل احترافي')"><div class="q-icon">✉️</div><div class="q-title">كتابة إيميل</div></div>
            <div class="quick-card" onclick="quickAction('ارسم قطة فضائية تركب صاروخ')"><div class="q-icon">🎨</div><div class="q-title">توليد صورة</div></div>
            <div class="quick-card" onclick="quickAction('اصنع فيديو مشهد سينمائي')"><div class="q-icon">🎬</div><div class="q-title">توليد فيديو</div></div>
        </div>
    </div>
    <div id="chatBox"></div>
</main>

<div class="input-wrap">
    <div class="input-inner">
        <div class="tools-row">
            <div class="tool-chip" onclick="document.getElementById('filePdf').click()">📄 PDF</div>
            <input type="file" id="filePdf" accept=".pdf" style="display:none" onchange="handlePdf(this)">
            <div class="tool-chip" onclick="exportChat()">💾 تصدير</div>
        </div>
        <div class="input-bar">
            <button class="attach-btn" id="btnMic" onclick="toggleVoiceInput()">🎤</button>
            <input type="text" id="chatInput" placeholder="اكتب رسالتك..." onkeypress="onEnter(event)">
            <button class="send-btn" id="btnSend" onclick="handleSendClick()">
                <span id="iconSend">➤</span>
                <span id="iconStop" style="display:none">■</span>
            </button>
        </div>
    </div>
</div>

<div id="overlay" onclick="toggleSidebar(false)"></div>
<div id="sidebar">
    <div class="sb-head"><h2>المحادثات</h2><button class="new-chat" onclick="newChat()">+ جديد</button></div>
    <div class="search-box"><input class="search-input" id="searchInput" placeholder="🔍 بحث..." oninput="searchChats(this.value)"></div>
    <div id="chatHistory"></div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-head"><h2>⚙️ الإعدادات</h2><button class="close-btn" onclick="closeModal('settingsModal')">✕</button></div>
    <div class="modal-body">
        <div class="card">
            <h3>👤 الملف الشخصي</h3>
            <input type="text" id="profName" placeholder="اسمك">
            <input type="text" id="profJob" placeholder="مهنتك">
            <button class="save-btn" onclick="saveProfile()">💾 حفظ</button>
        </div>
        <div class="card">
            <h3>🛡️ البيانات</h3>
            <button class="danger-btn" onclick="clearAllData()">🗑️ مسح كل شيء</button>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
