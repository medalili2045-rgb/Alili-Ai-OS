<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050A15">
<title>Alili AI</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="capacitor-bridge.js"></script>
</head>
<body>

<div id="splash">
    <img src="assets/icon.png" class="logo-img" alt="Alili AI" onerror="this.style.display='none'">
    <div class="logo-text">ALILI AI</div>
    <div class="logo-sub">مساعدك الذكي</div>
</div>

<div id="toast"></div>

<header>
    <div class="h-left">
        <button class="icon-btn" onclick="toggleSidebar(true)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="logo-txt">Alili AI</span>
    </div>
    <div class="h-right">
        <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
        <button class="icon-btn" onclick="openSettings()">⚙️</button>
    </div>
</header>

<main id="main">
    <div id="welcome">
        <div class="welcome-title">مرحباً بك 👋</div>
        <div class="welcome-sub">اسأل أي شيء، أو قل "ارسم لي..." أو "اصنع فيديو..."</div>
        <div class="quick-grid">
            <div class="quick-card" onclick="quickAction('اشرح لي الذكاء الاصطناعي ببساطة')">
                <div class="q-icon">🧠</div><div class="q-title">اشرح مفهوم</div>
            </div>
            <div class="quick-card" onclick="quickAction('اكتب لي إيميل احترافي')">
                <div class="q-icon">✉️</div><div class="q-title">كتابة إيميل</div>
            </div>
            <div class="quick-card" onclick="quickAction('ارسم قطة فضائية تركب صاروخ')">
                <div class="q-icon">🎨</div><div class="q-title">توليد صورة</div>
            </div>
            <div class="quick-card" onclick="quickAction('اصنع فيديو مشهد سينمائي لغروب الشمس')">
                <div class="q-icon">🎬</div><div class="q-title">توليد فيديو</div>
            </div>
        </div>
    </div>
    <div id="chatBox"></div>
</main>

<div class="input-wrap">
    <div class="input-inner">
        <div class="tools-row">
            <div class="tool-chip" onclick="document.getElementById('filePdf').click()">📄 PDF</div>
            <input type="file" id="filePdf" accept=".pdf" style="display:none" onchange="handlePdf(this)">
            <div class="tool-chip" onclick="exportChat()">💾 تصدير</div>
        </div>
        <div class="input-bar">
            <button class="attach-btn" id="btnMic" onclick="toggleVoiceInput()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
            </button>
            <input type="text" id="chatInput" placeholder="اكتب رسالتك..." onkeypress="onEnter(event)">
            <button class="send-btn" id="btnSend" onclick="handleSendClick()">
                <svg id="iconSend" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                <svg id="iconStop" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
        </div>
    </div>
</div>

<div id="overlay" onclick="toggleSidebar(false)"></div>
<div id="sidebar">
    <div class="sb-head">
        <h2>المحادثات</h2>
        <button class="new-chat" onclick="newChat()">+ جديد</button>
    </div>
    <div class="search-box">
        <input class="search-input" id="searchInput" placeholder="🔍 بحث..." oninput="searchChats(this.value)">
    </div>
    <div id="chatHistory"></div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-head"><h2>⚙️ الإعدادات</h2><button class="close-btn" onclick="closeModal('settingsModal')">✕</button></div>
    <div class="modal-body">
        <div class="card">
            <h3>👤 الملف الشخصي</h3>
            <input type="text" id="profName" placeholder="اسمك">
            <input type="text" id="profJob" placeholder="مهنتك">
            <button class="save-btn" onclick="saveProfile()">💾 حفظ</button>
        </div>
        <div class="card">
            <h3>🛡️ البيانات</h3>
            <button class="danger-btn" onclick="clearAllData()">🗑️ مسح كل شيء</button>
        </div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/voice.js"></script>
<script src="js/tools.js"></script>
<script src="js/chat.js"></script>
<script src="js/app.js"></script>
</body>
</html>
