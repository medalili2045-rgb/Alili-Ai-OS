<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050A15">
<title>Alili AI Pro</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icon.png">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="capacitor-bridge.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--bg:#050A15;--bg2:#0a0f1f;--card:rgba(10,20,40,0.85);--txt:#fff;--mut:#8fa3b8;--brd:rgba(0,210,255,0.15);--acc:#00d2ff;--acc2:#ff00cc;--success:#00ff87;--danger:#ff4444;--hover:rgba(0,210,255,0.1)}
body{background:var(--bg);color:var(--txt);height:100dvh;width:100vw;overflow:hidden;display:flex;flex-direction:column;background-image:radial-gradient(circle at 10% 20%,rgba(0,210,255,0.1),transparent 40%),radial-gradient(circle at 90% 80%,rgba(255,0,204,0.08),transparent 40%)}
button{cursor:pointer;font-family:inherit;background:none;border:none;color:inherit}
#splash{position:fixed;inset:0;background:var(--bg);z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}
#splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
#splash .logo{font-size:36px;font-weight:900;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header{flex-shrink:0;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(10,10,20,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center;z-index:100}
.h-left{display:flex;align-items:center;gap:8px;flex:1}
.h-right{display:flex;align-items:center;gap:10px}
.icon-btn{color:var(--mut);padding:6px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.icon-btn:active{background:var(--hover)}
.logo-txt{font-size:14px;font-weight:900;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.model-pill{font-size:10px;padding:4px 8px;border-radius:12px;background:var(--hover);border:1px solid var(--brd);color:var(--acc);font-weight:700;cursor:pointer}
main{flex:1;overflow-y:auto;padding:16px 14px 180px;display:flex;flex-direction:column;scroll-behavior:smooth}
#chatBox{display:flex;flex-direction:column;gap:14px;max-width:800px;margin:0 auto;width:100%}
#welcome{padding:20px;display:flex;flex-direction:column;align-items:center;text-align:center}
#welcome.hide{display:none}
.welcome-title{font-size:24px;font-weight:900;color:var(--acc);margin-bottom:6px}
.msg{display:flex;gap:8px;max-width:100%;animation:slideUp .3s}
.msg.user{flex-direction:row-reverse}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-top:2px}
.msg.user .avatar{background:linear-gradient(135deg,var(--acc),#0055ff);color:#fff}
.msg.ai .avatar{background:linear-gradient(135deg,var(--acc2),#7a00ff);color:#fff}
.bubble{max-width:calc(100% - 50px);padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.65;min-width:0;position:relative}
.msg.user .bubble{background:linear-gradient(135deg,var(--acc),#0055ff);color:#fff;border-top-right-radius:4px}
.msg.ai .bubble{background:var(--card);border:1px solid var(--brd);border-top-left-radius:4px}
.md p{margin-bottom:8px}.md p:last-child{margin-bottom:0}
.md pre{background:#0d1117;border-radius:10px;margin:10px 0;border:1px solid var(--brd);position:relative;direction:ltr}
.md pre code{display:block;padding:12px;overflow-x:auto}
.code-header{display:flex;justify-content:space-between;padding:6px 12px;background:#161b22;font-size:11px;color:#8b949e;border-bottom:1px solid rgba(255,255,255,0.05)}
.code-copy{padding:3px 8px;background:rgba(255,255,255,0.08);color:#e2e8f0;border-radius:5px;font-size:10px;cursor:pointer}
.msg-actions{display:flex;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--brd);flex-wrap:wrap}
.act-btn{padding:4px 8px;border-radius:6px;font-size:10px;font-weight:600;background:var(--hover);color:var(--mut);border:1px solid var(--brd);display:flex;align-items:center;gap:3px}
.msg-media{max-width:100%;border-radius:10px;margin-top:8px}
.input-wrap{position:fixed;bottom:0;left:0;right:0;padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:100}
.input-inner{max-width:800px;margin:0 auto}
.tools-row{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto;scrollbar-width:none}
.tool-chip{padding:5px 10px;border-radius:12px;background:var(--card);border:1px solid var(--brd);font-size:10px;font-weight:700;color:var(--mut);white-space:nowrap;display:flex;align-items:center;gap:4px;cursor:pointer}
.tool-chip.active{background:var(--acc);color:#000}
.input-bar{display:flex;gap:6px;align-items:center;background:var(--card);padding:5px 8px 5px 12px;border-radius:24px;border:1px solid var(--brd)}
.input-bar input{flex:1;min-width:0;padding:8px 4px;background:transparent;border:none;outline:none;color:var(--txt);font-size:14px}
.attach-btn{color:var(--mut);padding:6px;display:flex}
.send-btn{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#0055ff);display:flex;justify-content:center;align-items:center;color:#fff;flex-shrink:0}
.send-btn.stop{background:linear-gradient(135deg,var(--danger),#aa0000)}
#sidebar{position:fixed;top:0;right:-320px;width:300px;height:100dvh;background:var(--bg2);z-index:600;transition:right .3s;display:flex;flex-direction:column;border-left:1px solid var(--brd);padding-top:env(safe-area-inset-top)}
#sidebar.open{right:0}
.sb-head{padding:16px;border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center}
.new-chat{padding:6px 12px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--success));color:#000;font-size:11px;font-weight:800}
#chatHistory{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.chat-item{padding:10px;border-radius:8px;background:var(--hover);font-size:13px;cursor:pointer;color:var(--mut);display:flex;justify-content:space-between;align-items:center;border:1px solid transparent}
.chat-item.active{border-color:var(--acc);color:var(--txt)}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500;backdrop-filter:blur(4px)}
#overlay.show{display:block}
.modal{display:none;position:fixed;inset:0;background:var(--bg);z-index:1000;flex-direction:column;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));overflow-y:auto}
.modal.show{display:flex}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;max-width:600px;margin-left:auto;margin-right:auto;width:100%}
.close-btn{background:var(--hover);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.modal-body{max-width:600px;margin:0 auto;width:100%}
.card{background:var(--card);padding:14px;border-radius:12px;margin-bottom:10px;border:1px solid var(--brd)}
.card h3{font-size:12px;font-weight:800;margin-bottom:10px;color:var(--acc);display:flex;justify-content:space-between;cursor:pointer}
.card-body{overflow:hidden;transition:.3s;max-height:2000px;opacity:1}
.card.collapsed .card-body{max-height:0;opacity:0}
.card input, .card textarea, .card select{width:100%;padding:10px;border-radius:8px;background:rgba(0,0,0,0.3);border:1px solid var(--brd);color:var(--txt);font-size:13px;outline:none;margin-bottom:8px}
.save-btn{width:100%;padding:13px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#0055ff);color:#fff;border:none;font-weight:800;font-size:14px;margin-top:8px}
.danger-btn{width:100%;padding:11px;border-radius:8px;background:rgba(255,68,68,0.15);color:var(--danger);border:1px solid rgba(255,68,68,0.3);font-weight:700;font-size:12px;margin-top:8px}
.switch{position:relative;width:40px;height:22px;background:var(--hover);border-radius:12px;cursor:pointer;border:1px solid var(--brd);transition:.2s}
.switch::after{content:'';position:absolute;top:2px;right:2px;width:16px;height:16px;background:var(--mut);border-radius:50%;transition:.2s}
.switch.on{background:var(--acc);border-color:var(--acc)}
.switch.on::after{background:#fff;right:calc(100% - 18px)}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:12px}
#toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.95);color:#fff;padding:10px 18px;border-radius:10px;font-size:12px;z-index:10000;opacity:0;transition:.3s;pointer-events:none;border:1px solid var(--brd)}
#toast.show{opacity:1}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing span{width:6px;height:6px;background:var(--acc);border-radius:50%;animation:bounce 1.4s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.16s}
.typing span:nth-child(3){animation-delay:.32s}
@keyframes bounce{0%,80%,100%{transform:scale(0);opacity:.3}40%{transform:scale(1);opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="splash"><div class="logo">ALILI</div></div>
<div id="toast"></div>
<header>
  <div class="h-left">
    <button class="icon-btn" onclick="toggleSidebar(true)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <span class="logo-txt">Alili AI</span>
    <span class="model-pill" id="headerModel" onclick="openSettings()">تلقائي</span>
  </div>
  <div class="h-right">
    <button class="icon-btn" onclick="toggleTheme()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg></button>
    <button class="icon-btn" onclick="openSettings()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
</header>
<main id="main">
  <div id="welcome"><div class="welcome-title">مرحباً بك في Alili AI</div><div style="color:var(--mut);font-size:13px;margin-bottom:20px">أقوى مساعد ذكي، الآن مجاناً.</div></div>
  <div id="chatBox"></div>
</main>
<div class="input-wrap">
  <div class="input-inner">
    <div class="tools-row">
      <div class="tool-chip" onclick="generateImagePrompt()">🎨 صورة</div>
      <label class="tool-chip" for="filePdf">📄 PDF</label>
      <input type="file" id="filePdf" accept=".pdf" style="display:none" onchange="handlePdf(this)">
      <div class="tool-chip" onclick="runAgentTask()">🤖 وكيل</div>
    </div>
    <div class="input-bar">
      <input type="text" id="chatInput" placeholder="اكتب رسالتك..." onkeypress="onEnter(event)">
      <button class="attach-btn" id="btnMic" onclick="toggleVoiceInput()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg></button>
      <button class="send-btn" id="btnSend" onclick="handleSendClick()"><svg id="iconSend" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
    </div>
  </div>
</div>
<div id="overlay" onclick="toggleSidebar(false)"></div>
<div id="sidebar">
  <div class="sb-head"><h2>المحادثات</h2><button class="new-chat" onclick="newChat()">+ جديد</button></div>
  <div id="chatHistory"></div>
</div>
<div id="settingsModal" class="modal">
  <div class="modal-head"><h2>⚙️ الإعدادات</h2><button class="close-btn" onclick="closeModal('settingsModal')">✕</button></div>
  <div class="modal-body">
    <div class="card">
      <h3 onclick="toggleCard(this)">🧠 النموذج</h3>
      <div class="card-body">
        <select id="selModel" onchange="saveModel()">
          <option value="auto">🔄 تبديل تلقائي</option>
          <option value="groq_smart">⚡ Groq (GPT-OSS 120B)</option>
          <option value="groq_fast">💨 Groq (GPT-OSS 20B)</option>
          <option value="qwen">💻 Qwen Coder</option>
          <option value="deepseek">🧠 DeepSeek R1</option>
          <option value="gemma">🌟 Gemma 4</option>
        </select>
      </div>
    </div>
    <div class="card">
      <h3 onclick="toggleCard(this)">👤 الملف الشخصي</h3>
      <div class="card-body">
        <input type="text" id="profName" placeholder="الاسم">
        <input type="text" id="profJob" placeholder="المهنة">
        <button class="save-btn" onclick="saveProfile()">💾 حفظ</button>
      </div>
    </div>
    <button class="danger-btn" onclick="clearAllData()">🗑️ مسح كل البيانات</button>
  </div>
</div>
<script>
const WORKER_URL = "https://alili-ai-pro.medalili2045.workers.dev";
if(typeof marked !== 'undefined') marked.setOptions({breaks:true, gfm:true});
if(typeof pdfjsLib !== 'undefined') pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
let store = localforage.createInstance({name:'AliliAI'});
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function mdParse(text){ return marked.parse(text||''); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.className='show'; setTimeout(()=>t.className='', 3000); }
let allChats={}, currentChatId=null, pendingChatId=null;
let attachedPdfText=null, isRecording=false, recognition=null;
let userProfile = JSON.parse(localStorage.getItem('user_profile')||'{"name":"","job":""}');
let selectedModel = localStorage.getItem('selected_model') || 'auto';

async function loadChats(){ const s=await store.getItem('chats'); if(s) allChats=s; if(!Object.keys(allChats).length) newChat(); else { currentChatId=Object.keys(allChats).sort((a,b)=>allChats[b].ts-allChats[a].ts)[0]; } renderHistory(); renderChat(); }
async function saveChats(){ await store.setItem('chats', allChats); }
function newChat(){ currentChatId=Date.now().toString(); allChats[currentChatId]={id:currentChatId,title:'محادثة جديدة',ts:Date.now(),messages:[]}; saveChats(); renderHistory(); renderChat(); toggleSidebar(false); }
function switchChat(id){ currentChatId=id; renderHistory(); renderChat(); toggleSidebar(false); }
function deleteChat(id){ if(!confirm('حذف؟'))return; delete allChats[id]; saveChats(); if(currentChatId===id) newChat(); else renderHistory(); }
function renderHistory(){ const list=document.getElementById('chatHistory'); list.innerHTML=''; Object.values(allChats).sort((a,b)=>b.ts-a.ts).forEach(c=>{ const d=document.createElement('div'); d.className='chat-item'+(c.id===currentChatId?' active':''); d.innerHTML=`<span>${escapeHtml(c.title)}</span><button onclick="event.stopPropagation();deleteChat('${c.id}')" style="color:var(--danger)">🗑️</button>`; d.onclick=()=>switchChat(c.id); list.appendChild(d); }); }
function renderChat(){ const box=document.getElementById('chatBox'); box.innerHTML=''; const msgs=allChats[currentChatId]?.messages||[]; document.getElementById('welcome').classList.toggle('hide', msgs.length>0); msgs.forEach((m,i)=>{ const w=document.createElement('div'); w.className='msg '+(m.role==='user'?'user':'ai'); let c = m.role==='ai'?mdParse(m.content):escapeHtml(m.content); if(m.image) c=`<img src="${m.image}" class="msg-media">`+c; w.innerHTML=`<div class="avatar">${m.role==='user'?'👤':'✨'}</div><div class="bubble ${m.role==='ai'?'md':''}">${c}</div>`; if(m.role==='ai'){ const acts=document.createElement('div'); acts.className='msg-actions'; acts.innerHTML=`<button class="act-btn" onclick="copyText(this)">📋 نسخ</button><button class="act-btn" onclick="speakText(this)">🔊 استماع</button>`; w.querySelector('.bubble').appendChild(acts); } box.appendChild(w); }); scrollBottom(); enhanceCode(); }
function scrollBottom(){ const m=document.getElementById('main'); m.scrollTop=m.scrollHeight; }
function enhanceCode(){ document.querySelectorAll('.md pre').forEach(pre=>{ if(pre.dataset.enh) return; pre.dataset.enh='1'; const code=pre.querySelector('code'); if(!code) return; try{ hljs.highlightElement(code); }catch(e){} }); }
function copyText(btn){ const text=btn.closest('.bubble').innerText; navigator.clipboard.writeText(text); toast('✅ تم النسخ'); }
function speakText(btn){ const text=btn.closest('.bubble').innerText; window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='ar-SA'; window.speechSynthesis.speak(u); }
async function generateImagePrompt(){ const p=prompt("وصف الصورة:"); if(p) sendImageRequest(p); }
async function sendImageRequest(prompt){
  document.getElementById('welcome').classList.add('hide');
  const cid=currentChatId; allChats[cid].messages.push({role:'user',content:`🎨 ${prompt}`}); saveChats(); renderChat();
  const w=document.createElement('div'); w.className='msg ai'; w.innerHTML=`<div class="avatar">✨</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`; document.getElementById('chatBox').appendChild(w); scrollBottom();
  try{ const res=await fetch(WORKER_URL+"/image",{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})}); const d=await res.json(); if(d.error) throw new Error(d.error); allChats[cid].messages.push({role:'assistant',content:'',image:d.image}); saveChats(); if(currentChatId===cid) renderChat(); }catch(e){ w.querySelector('.bubble').innerHTML=`<span style="color:var(--danger)">❌ ${e.message}</span>`; }
}
async function runAgentTask(){
  const task = prompt("ما هي المهمة التي تريد من الوكيل تنفيذها؟ (مثال: ذكرني بعد ساعة)");
  if(!task) return;
  toast('🤖 جاري تنفيذ المهمة...');
  if (window.AliliNative && window.AliliNative.runAgent) {
    const res = await window.AliliNative.runAgent(task);
    alert(JSON.stringify(res));
  } else {
    alert('الوكيل غير متاح في هذه النسخة.');
  }
}
async function handlePdf(input){ if(!input.files?.length) return; toast('⏳ جاري القراءة...'); try{ const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await input.files[0].arrayBuffer())}).promise; let txt=''; for(let i=1;i<=Math.min(pdf.numPages,5);i++){ const c=await (await pdf.getPage(i)).getTextContent(); txt+=c.items.map(x=>x.str).join(' ')+'\n'; } attachedPdfText=txt; toast('✅ PDF جاهز'); }catch(e){ toast('❌ فشل'); } input.value=''; }
async function sendMessage(){
  if(pendingChatId) return toast('⏳ انتظر');
  const input=document.getElementById('chatInput'); let text=input.value.trim();
  if(!text && !attachedPdfText) return;
  if(attachedPdfText){ text=`[PDF]:\n${attachedPdfText.substring(0,4000)}\n\n[سؤال]: ${text||'لخص'}`; attachedPdfText=null; }
  document.getElementById('welcome').classList.add('hide');
  const cid=currentChatId; allChats[cid].messages.push({role:'user',content:text}); if(allChats[cid].title==='محادثة جديدة'){ allChats[cid].title=text.substring(0,20); renderHistory(); }
  input.value=''; renderChat(); pendingChatId=cid;
  const w=document.createElement('div'); w.className='msg ai'; w.innerHTML=`<div class="avatar">✨</div><div class="bubble md"></div>`; document.getElementById('chatBox').appendChild(w); scrollBottom();
  const mdEl=w.querySelector('.md'); let aiFull='';
  try{
    let sys = "أنت Alili AI.";
    if(userProfile.name) sys += ` اسم المستخدم: ${userProfile.name}.`;
    if(userProfile.job) sys += ` مهنته: ${userProfile.job}.`;
    let msgs = [{role:'system', content:sys}, ...allChats[cid].messages.filter(m=>!m.image).map(m=>({role:m.role,content:m.content}))];
    const res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs, model:selectedModel})});
    if(!res.ok) throw new Error('فشل الاتصال');
    const reader=res.body.getReader(); const dec=new TextDecoder();
    while(true){ const {done,value}=await reader.read(); if(done) break; for(const line of dec.decode(value,{stream:true}).split('\n')){ if(line.startsWith('data: ') && !line.includes('[DONE]')){ try{ const d=JSON.parse(line.substring(6)); const t=d.choices?.[0]?.delta?.content||''; if(t){ aiFull+=t; mdEl.innerHTML=mdParse(aiFull); scrollBottom(); } }catch(e){} } } }
    allChats[cid].messages.push({role:'assistant',content:aiFull}); saveChats(); renderChat();
  }catch(e){ mdEl.innerHTML=`<span style="color:var(--danger)">❌ ${e.message}</span>`; }finally{ pendingChatId=null; }
}
function handleSendClick(){ if(!pendingChatId) sendMessage(); }
function onEnter(e){ if(e.key==='Enter'){ e.preventDefault(); sendMessage(); } }
function toggleSidebar(o){ document.getElementById('sidebar').classList.toggle('open',o); document.getElementById('overlay').classList.toggle('show',o); }
function openSettings(){ document.getElementById('profName').value=userProfile.name||''; document.getElementById('profJob').value=userProfile.job||''; document.getElementById('selModel').value=selectedModel; document.getElementById('settingsModal').classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function saveProfile(){ userProfile={name:document.getElementById('profName').value,job:document.getElementById('profJob').value}; localStorage.setItem('user_profile',JSON.stringify(userProfile)); toast('✅ تم الحفظ'); }
function saveModel(){ selectedModel=document.getElementById('selModel').value; localStorage.setItem('selected_model',selectedModel); document.getElementById('headerModel').textContent = selectedModel==='auto'?'تلقائي':selectedModel; toast('✅ تم تغيير النموذج'); }
function toggleCard(h){ h.parentElement.classList.toggle('collapsed'); }
function toggleTheme(){ document.body.classList.toggle('light'); localStorage.setItem('theme', document.body.classList.contains('light')?'light':'dark'); }
if(localStorage.getItem('theme')==='light') document.body.classList.add('light');
async function clearAllData(){ if(!confirm('مسح كل شيء؟')) return; localStorage.clear(); await store.clear(); location.reload(); }
function toggleVoiceInput(){
  if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) return toast('غير مدعوم');
  if(!recognition){ const SR = window.SpeechRecognition||window.webkitSpeechRecognition; recognition = new SR(); recognition.lang='ar-SA'; recognition.interimResults=false; recognition.onstart=()=>{ isRecording=true; document.getElementById('btnMic').style.color='var(--danger)'; toast('🎤 جاري الاستماع...'); }; recognition.onresult=(e)=>{ document.getElementById('chatInput').value += e.results[0][0].transcript; }; recognition.onend=()=>{ isRecording=false; document.getElementById('btnMic').style.color='var(--mut)'; }; }
  if(isRecording) recognition.stop(); else recognition.start();
}
window.onload=async()=>{
  if(window.AliliNative) try{ await window.AliliNative.init(); }catch(e){}
  document.getElementById('headerModel').textContent = selectedModel==='auto'?'تلقائي':selectedModel;
  setTimeout(()=>document.getElementById('splash').classList.add('hidden'),1000);
  await loadChats();
};
</script>
